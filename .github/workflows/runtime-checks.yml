name: Runtime checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/satori/package-lock.json
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm --prefix apps/satori run build
      - run: npm --prefix apps/satori test
      - run: npm --prefix apps/satori run test:tz-chicago
      - name: Build and check Satori container runtime
        run: |
          docker build -t satori-runtime-check apps/satori
          test "$(docker run --rm --entrypoint node satori-runtime-check --version)" = "v$(cat .node-version)"
